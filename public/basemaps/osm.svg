<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" width="240" height="135">
  <rect width="240" height="135" fill="#f2efe9"/>
  <!-- Green parks -->
  <polygon points="18,14 68,10 74,46 22,52" fill="#cdebb0"/>
  <polygon points="154,78 210,72 216,118 160,122" fill="#cdebb0"/>
  <rect x="92" y="20" width="38" height="26" rx="4" fill="#d9f0c4"/>
  <!-- Subtle urban blocks -->
  <g fill="#e3dfd7">
    <rect x="14" y="64" width="24" height="18" rx="1"/>
    <rect x="44" y="64" width="26" height="18" rx="1"/>
    <rect x="82" y="56" width="22" height="20" rx="1"/>
    <rect x="112" y="56" width="24" height="16" rx="1"/>
    <rect x="148" y="22" width="28" height="22" rx="1"/>
    <rect x="184" y="22" width="32" height="22" rx="1"/>
    <rect x="80" y="92" width="34" height="22" rx="1"/>
    <rect x="122" y="94" width="24" height="20" rx="1"/>
  </g>
  <!-- River -->
  <path d="M-8,106 C38,94 64,108 106,82 C146,56 184,68 248,44" fill="none" stroke="#aad3df" stroke-width="9" stroke-linecap="round"/>
  <!-- Local white street network -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <line x1="0" y1="58" x2="240" y2="58"/>
    <line x1="0" y1="88" x2="240" y2="88"/>
    <line x1="76" y1="0" x2="76" y2="135"/>
    <line x1="142" y1="0" x2="142" y2="135"/>
    <line x1="178" y1="0" x2="178" y2="135"/>
  </g>
  <!-- Arterial yellow & orange roads -->
  <path d="M-10,32 L116,74 L250,118" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M-10,32 L116,74 L250,118" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M46,140 L116,74 L198,-6" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <path d="M46,140 L116,74 L198,-6" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Junction circle -->
  <circle cx="116" cy="74" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
